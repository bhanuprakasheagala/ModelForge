[project]
name = "modelforge"
version = "0.1.0"
description = "A hands-on lab for learning and building AI systems"
readme = "README.md"
authors = [
    { name = "bhanuprakasheagala", email = "username@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]>=2.3.0",
]

[project.scripts]
modelforge = "modelforge:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
